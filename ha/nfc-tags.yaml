# HA automations for the workshop alarm NFC tags.
#
# Outside tag -> disarm; inside tag -> arm away. Both drive the same MQTT
# alarm panel as the HA app, the dashboard and Siri, so the arming
# preconditions, the exit/entry delays and the shop-alarm audit events are
# unchanged.
#
# Install: append these entries to /opt/homeassistant/automations.yaml (or
# paste each one via Settings -> Automations -> Create automation -> Edit in
# YAML) and reload the automations. The tag IDs are the existing tags in
# Settings -> Tags: `b9396bf2-a00e-4dee-ac9a-18c2575b98fd` is the outside tag
# (disarm), `75ec6013-c3e2-487c-8305-e0ffae4625b2` is the inside tag (arm).
# See docs/siri-and-nfc.md.
#
# A tag is only a trigger: the scan is delivered by an authenticated Home
# Assistant Companion app, so a copied tag on a phone that is not signed in to
# HA does nothing. To make the outside tag work only with one phone, uncomment
# `device_id:` below and paste the id from the `tag_scanned` event
# (Developer Tools -> Events). Any other signed-in phone is then ignored.

- id: werkstatt_nfc_outside_disarm
  alias: "Werkstatt Alarm: outside NFC tag disarms"
  mode: single
  max_exceeded: silent
  trigger:
    - platform: tag
      tag_id: "b9396bf2-a00e-4dee-ac9a-18c2575b98fd"
      # Optional: only accept scans from the trusted phone.
      # device_id: "<iphone-device-id>"
  condition:
    # DISARM on an already disarmed panel would re-run the disarm actor
    # sequence (lights, power strip, radio); skip it.
    - condition: state
      entity_id: alarm_control_panel.werkstatt
      state:
        - arming
        - armed_away
        - pending
        - triggered
  action:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.werkstatt

- id: werkstatt_nfc_inside_arm
  alias: "Werkstatt Alarm: inside NFC tag arms away"
  mode: single
  max_exceeded: silent
  trigger:
    - platform: tag
      tag_id: "75ec6013-c3e2-487c-8305-e0ffae4625b2"
  condition:
    # ARM_AWAY is a no-op (and logs arm_failed) unless the panel is disarmed;
    # matching the state machine here keeps the audit stream clean.
    - condition: state
      entity_id: alarm_control_panel.werkstatt
      state: disarmed
  action:
    - action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.werkstatt
