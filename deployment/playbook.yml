- name: Deploy the shop alarm system
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_dir: "{{ ansistrano_deploy_to }}/current"
    blink1_mqtt_topic: werkstatt/blink1
    lock_mqtt_topic: werkstatt/lock
    nfc_mqtt_topic: werkstatt/nfc
    # motion_mqtt_topic: werkstatt/motion
    # mqtt_telegram_mqtt_topic: werkstatt/telegram
  roles:
    - role: ansistrano.deploy
      become: false
      vars:
        ansistrano_deploy_from: "{{ playbook_dir }}/../src/"
        ansistrano_deploy_to: /opt/shop-alarm
        ansistrano_current_via: symlink
        ansistrano_deploy_via: rsync
        ansistrano_before_setup_tasks_file: "{{ playbook_dir }}/roles/shop-alarm/tasks/owner.yml"
        ansistrano_after_symlink_tasks_file: "{{ playbook_dir }}/roles/shop-alarm/tasks/main.yml"
      tags: [ mqtt, deploy, alarm ]
    - role: mqtt-blink1
      tags: [ mqtt, blink1 ]
    - role: mqtt-lock
      tags: [ mqtt, lock, alarm ]
    # - role: mqtt-motion
#    - role: mqtt-telegram
    - role: mqtt-nfc
      tags: [ mqtt, nfc ]
    - role: uhlig-it.ansible-role-mosquitto-bridge
      tags: [ mqtt, mosquitto ]
