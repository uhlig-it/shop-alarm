- name: Deploy the shop alarm system
  hosts: all
  become: false
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    lock_mqtt_command_topic: werkstatt/lock/cmnd
    lock_mqtt_status_topic: werkstatt/lock/status
    nfc_mqtt_status_topic: werkstatt/nfc/status
    # motion_mqtt_topic: werkstatt/motion
    ansistrano_deploy_to: /opt/shop-alarm # needs to be global because other roles rely on it
  roles:
    - role: nerab.ruby
      vars:
        ruby_version:
          major: 3
          minor: 3
          teeny: 0
      become: true
      tags: [ ruby ]
    - role: ansistrano.deploy
      become: false
      vars:
        ansistrano_deploy_from: "{{ playbook_dir }}/../src/"
        ansistrano_current_via: symlink
        ansistrano_deploy_via: rsync
        ansistrano_shared_paths:
          - log
          - tmp
          - gems
        ansistrano_keep_releases: 5
        ansistrano_before_setup_tasks_file: "{{ playbook_dir }}/roles/shop-alarm/tasks/owner.yml"
        ansistrano_after_symlink_tasks_file: "{{ playbook_dir }}/roles/shop-alarm/tasks/main.yml"
      tags: [ mqtt, deploy, alarm ]
    - role: mqtt-lock
      tags: [ mqtt, lock, alarm ]
    - role: mqtt-nfc
      tags: [ mqtt, nfc, alarm ]
    - role: uhlig-it.ansible-role-mosquitto-bridge
      tags: [ mqtt, mosquitto, bridge ]
