- name: System packages are installed
  apt:
    name:
      - python3-gpiozero
      - python3-pip
      - python3-setuptools
    state: present
    update_cache: true
  tags: apt, gpio, pip, python

- name: MQTT library is installed
  pip:
    name: paho-mqtt
  tags: python, pip, mqtt

- name: Service template is rendered
  template:
    src: mqtt-pir.service.j2
    dest: /etc/systemd/system/mqtt-pir.service
    mode: "0664"
  become: true
  tags: systemd, service

- name: Config changes are picked up by systemd
  systemd:
    daemon_reload: yes
  become: true
  tags: systemd, service

- name: Service is enabled
  systemd:
    name: mqtt-pir.service
    enabled: true
  become: true
  tags: systemd, service

- name: Service is restarted
  systemd:
    name: mqtt-pir.service
    state: restarted
  become: true
  tags: systemd, service
